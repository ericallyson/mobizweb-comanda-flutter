include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # Nas folhas (`SheetBody`) o rodapé vem DEPOIS do conteúdo, na ordem em
    # que aparece na tela — mais fácil de ler do que `children` por último.
    sort_child_properties_last: false

formatter:
  page_width: 120
analyzer:
  exclude:
    - build/**
    - android/**
